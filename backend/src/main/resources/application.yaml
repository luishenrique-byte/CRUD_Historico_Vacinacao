server:
  port: 8082

spring:
  application:
    name: Historico_Vacinacao
  datasource:
    url: jdbc:postgresql://localhost:5432/dbHistorico_Vacina
    username: ${DATABASE_USERNAME:postgres} #Variavel de Ambiente
    password: ${DATABASE_PASSWORD:postgres} #Variavel de Ambiente
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

